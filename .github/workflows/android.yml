
name: Build Sonic 8D APK

on:
  workflow_dispatch:
  push:
    paths:
      - "Sonic-8D-Music-Player.zip"
      - ".github/workflows/android.yml"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Extract Android project ZIP
        run: |
          test -f Sonic-8D-Music-Player.zip
          mkdir -p project
          unzip -o Sonic-8D-Music-Player.zip -d project

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build debug APK
        working-directory: project
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Sonic-8D-Music-Player-debug-apk
          path: project/app/build/outputs/apk/debug/app-debug.apk
          
