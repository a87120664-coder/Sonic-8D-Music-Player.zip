name: Build Sonic 8D APK

on:
  workflow_dispatch:
  push:
    paths:
      - "**"
      - ".github/workflows/android.yml"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Find and extract ZIP
        shell: bash
        run: |
          echo "All repository files:"
          find . -maxdepth 3 -type f -print

          ZIP_FILE=""

          for f in ./*; do
            if [ -f "$f" ] && [[ "${f,,}" == *.zip ]]; then
              ZIP_FILE="$f"
              break
            fi
          done

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: ZIP not found in repository root"
            exit 1
          fi

          echo "ZIP found: $ZIP_FILE"
          unzip -t "$ZIP_FILE"
          mkdir -p project
          unzip -o "$ZIP_FILE" -d project

      - name: Find Android project
        shell: bash
        run: |
          PROJECT_DIR="$(find "$PWD/project" -type f \( -name settings.gradle -o -name settings.gradle.kts \) -print -quit | xargs -r dirname)"

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: Android project not found in ZIP"
            find project -maxdepth 5 -type f -print
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Found project: $PROJECT_DIR"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build APK
        run: gradle -p "$PROJECT_DIR" assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Sonic-8D-Music-Player-APK
          path: project/**/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          
